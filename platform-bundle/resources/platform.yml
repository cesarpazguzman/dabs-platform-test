# Shared objects owned by the platform. Use-case bundles cannot create schemas (platform rule 1):
# they refer to these by name, through their `schema` variable.
resources:
  schemas:
    landing:       { catalog_name: "${var.catalog}", name: landing }
    sales_dev:     { catalog_name: "${var.catalog}", name: sales_dev }
    sales_qa:      { catalog_name: "${var.catalog}", name: sales_qa }
    sales_prd:     { catalog_name: "${var.catalog}", name: sales_prd }
    ingestion_dev: { catalog_name: "${var.catalog}", name: ingestion_dev }
    ingestion_qa:  { catalog_name: "${var.catalog}", name: ingestion_qa }
    ingestion_prd: { catalog_name: "${var.catalog}", name: ingestion_prd }
    dqx_test_dev:  { catalog_name: "${var.catalog}", name: dqx_test_dev }
    dqx_test_qa:   { catalog_name: "${var.catalog}", name: dqx_test_qa }
    dqx_test_prd:  { catalog_name: "${var.catalog}", name: dqx_test_prd }

  volumes:
    landing_files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing.name}
      name: files
      volume_type: MANAGED

    # dqx_test: rule files, profiler output and streaming checkpoints, one volume per environment
    # (each one is reached as /Volumes/<catalog>/dqx_test_<env>/files)
    dqx_test_dev_files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.dqx_test_dev.name}
      name: files
      volume_type: MANAGED
    dqx_test_qa_files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.dqx_test_qa.name}
      name: files
      volume_type: MANAGED
    dqx_test_prd_files:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.dqx_test_prd.name}
      name: files
      volume_type: MANAGED
