name: bundle-ci

# Branching model (one branch per environment):
#   feature/* --PR--> qa   --push--> deploy to qa
#   qa        --PR--> main --push--> deploy to prd (after approval)
#   hotfix/*  --PR--> main --push--> deploy to prd (after approval), then merge main back into qa
#
# Identities:
#   - plan and deploy-qa use the qa service principal (repository secrets, or the qa environment)
#   - deploy-prd uses the prd service principal (secrets of the prd environment override the repository ones)

on:
  workflow_call:
    inputs:
      bundle_path:            # bundle folder inside the calling repository
        type: string
        required: true

env:
  # Target of the branch the change goes into: the PR base branch, or the pushed branch
  TARGET: ${{ (github.base_ref || github.ref_name) == 'main' && 'prd' || 'qa' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: ${{ inputs.bundle_path }}
    steps:
      - name: Branch policy (only qa and hotfix/* can be merged into main)
        if: github.base_ref == 'main'
        working-directory: .
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            qa|hotfix/*) echo "Source branch $HEAD_REF is allowed into main" ;;
            *) echo "::error::Only qa or hotfix/* branches can be merged into main (got $HEAD_REF). Open the PR against qa."
               exit 1 ;;
          esac
      - uses: actions/checkout@v5                 # use-case code
      - uses: actions/checkout@v5                 # platform rules
        with:
          repository: cesarpazguzman/dabs-platform-test
          ref: v1
          path: _platform
      - uses: databricks/setup-cli@main
      - name: Bundle Python environment (if needed)
        run: |
          if [ -f requirements-bundle.txt ]; then
            python3 -m venv .venv && .venv/bin/pip install -r requirements-bundle.txt
          fi
      - name: Validate
        run: databricks bundle validate --strict -t "$TARGET"     # warnings (e.g. unknown fields) fail the build
      - name: Platform rules
        run: |
          databricks bundle validate -t "$TARGET" --output json \
            | python3 $GITHUB_WORKSPACE/_platform/ci/check_rules.py
      - name: Plan (qa only; the prd plan runs in deploy-prd with the prd identity)
        if: env.TARGET == 'qa'
        run: databricks bundle plan -t qa
      - name: Set up Java (unit tests)
        if: hashFiles(format('{0}/tests/**', inputs.bundle_path)) != ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests (if the bundle has a tests/ folder)
        if: hashFiles(format('{0}/tests/**', inputs.bundle_path)) != ''
        run: |
          python3 -m venv .venv-test
          .venv-test/bin/pip install -q -r requirements-test.txt
          .venv-test/bin/pytest -q tests

  deploy-qa:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    environment: qa                              # no approval; restricted to the qa branch
    concurrency:                                 # one deploy at a time; a newer run replaces a queued one
      group: qa-${{ github.repository }}-${{ inputs.bundle_path }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: ${{ inputs.bundle_path }}
    steps:
      - uses: actions/checkout@v5
      - uses: databricks/setup-cli@main
      - name: Bundle Python environment (if needed)
        run: |
          if [ -f requirements-bundle.txt ]; then
            python3 -m venv .venv && .venv/bin/pip install -r requirements-bundle.txt
          fi
      - name: Deploy to qa
        run: databricks bundle deploy -t qa

  deploy-prd:
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prd                             # waits for a reviewer to approve; restricted to main
    concurrency:                                 # runs are approved one at a time, oldest first
      group: prd-${{ github.repository }}-${{ inputs.bundle_path }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    env:                                         # prd environment secrets: prd service principal
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: ${{ inputs.bundle_path }}
    steps:
      - uses: actions/checkout@v5
      - name: Refuse stale deployments
        run: |
          # actions/checkout points origin/main at this run's commit, so fetch the real tip of main
          git fetch --quiet origin main
          echo "This run: $GITHUB_SHA. Current main: $(git rev-parse FETCH_HEAD)"
          # Compare content, not commit IDs, so it works with merge, squash and rebase
          if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- .; then
            echo "::error::${{ inputs.bundle_path }} has changed on main since $GITHUB_SHA. Approve the newest run instead."
            git diff --stat "$GITHUB_SHA" FETCH_HEAD -- .
            exit 1
          fi
      - uses: databricks/setup-cli@main
      - name: Bundle Python environment (if needed)
        run: |
          if [ -f requirements-bundle.txt ]; then
            python3 -m venv .venv && .venv/bin/pip install -r requirements-bundle.txt
          fi
      - name: Plan prd
        run: databricks bundle plan -t prd
      - name: Deploy to prd
        run: databricks bundle deploy -t prd
