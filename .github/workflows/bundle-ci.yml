name: bundle-ci

# Identities:
#   - plan and deploy-qa use the qa service principal (repository secrets, or the qa environment)
#   - deploy-prd uses the prd service principal (secrets of the prd environment override the repository ones)

on:
  workflow_call:
    inputs:
      bundle_path:            # bundle folder inside the calling repository
        type: string
        required: true

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: ${{ inputs.bundle_path }}
    steps:
      - uses: actions/checkout@v4                 # use-case code
      - uses: actions/checkout@v4                 # platform rules
        with:
          repository: cesarpazguzman/dabs-platform-test
          ref: v1
          path: _platform
      - uses: databricks/setup-cli@main
      - name: Bundle Python environment (if needed)
        run: |
          if [ -f requirements-bundle.txt ]; then
            python3 -m venv .venv && .venv/bin/pip install -r requirements-bundle.txt
          fi
      - name: Validate
        run: databricks bundle validate --strict -t qa     # warnings (e.g. unknown fields) fail the build
      - name: Platform rules
        run: |
          databricks bundle validate -t qa --output json \
            | python3 $GITHUB_WORKSPACE/_platform/ci/check_rules.py
      - name: Plan
        run: databricks bundle plan -t qa

  deploy-qa:
    needs: plan
    if: github.ref == 'refs/heads/main'          # only on merge
    environment: qa                              # no approval; restricted to main
    concurrency:                                 # one deploy at a time; a newer run replaces a queued one
      group: qa-${{ github.repository }}-${{ inputs.bundle_path }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: ${{ inputs.bundle_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Bundle Python environment (if needed)
        run: |
          if [ -f requirements-bundle.txt ]; then
            python3 -m venv .venv && .venv/bin/pip install -r requirements-bundle.txt
          fi
      - name: Deploy to qa
        run: databricks bundle deploy -t qa

  deploy-prd:
    needs: deploy-qa
    if: github.ref == 'refs/heads/main'
    environment: prd                             # waits for a reviewer to approve
    concurrency:                                 # a newer run cancels an older one still waiting for approval
      group: prd-${{ github.repository }}-${{ inputs.bundle_path }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:                                         # prd environment secrets: prd service principal
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    defaults:
      run:
        working-directory: ${{ inputs.bundle_path }}
    steps:
      - uses: actions/checkout@v4                 # same commit that was deployed to qa
        with:
          fetch-depth: 0                          # full history, to compare with main
      - name: Refuse stale deployments
        run: |
          latest=$(git log -1 --format=%H origin/main -- .)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_SHA is not the latest change to ${{ inputs.bundle_path }} on main ($latest). Approve the newest run instead."
            exit 1
          fi
      - uses: databricks/setup-cli@main
      - name: Bundle Python environment (if needed)
        run: |
          if [ -f requirements-bundle.txt ]; then
            python3 -m venv .venv && .venv/bin/pip install -r requirements-bundle.txt
          fi
      - name: Deploy to prd
        run: databricks bundle deploy -t prd
